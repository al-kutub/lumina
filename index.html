<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07061a" />
  <meta name="description" content="LUMINA — neon orb merge. Drop, fuse, ascend." />
  <title>LUMINA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="nebula" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>

    <header class="hud" id="hud" hidden>
      <div class="hud-block">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-brand">LUMINA</div>
      <div class="hud-block hud-block--right">
        <span class="hud-label" id="bestLabel">Best</span>
        <span class="hud-value" id="best">0</span>
      </div>
    </header>

    <div class="next-preview" id="nextPreview" hidden>
      <span class="hud-label">Next</span>
      <canvas id="nextCanvas" width="56" height="56" aria-hidden="true"></canvas>
    </div>

    <button type="button" class="mute-btn" id="muteBtn" aria-label="Toggle sound" title="Mute">
      <span id="muteIcon">♪</span>
    </button>

    <main class="stage">
      <canvas id="gameCanvas"></canvas>
      <div class="combo-flash" id="comboFlash" aria-hidden="true"></div>
    </main>

    <section class="screen screen--title" id="titleScreen">
      <div class="title-atmosphere" aria-hidden="true"></div>
      <h1 class="brand">LUMINA</h1>
      <p class="tagline">Drop. Fuse. Ascend.</p>
      <div class="cta-row">
        <button type="button" class="cta" id="startBtn">Play</button>
        <button type="button" class="cta cta--secondary" id="dailyBtn">Daily</button>
      </div>
      <p class="daily-note" id="dailyNote" hidden>Same drops, your physics</p>
      <p class="hint">Aim with pointer · click / tap to drop</p>
    </section>

    <section class="screen screen--over" id="gameOverScreen" hidden>
      <div class="over-card" id="runSummaryCard">
        <p class="over-brand" aria-hidden="true">LUMINA</p>
        <p class="over-kicker">Overflow</p>
        <h2 class="over-title">Run complete</h2>

        <div class="over-stats" id="runStats">
          <div class="over-score-block">
            <span class="over-stat-label">Score</span>
            <span class="over-score-value" id="finalScore">0</span>
          </div>
          <div class="over-meta">
            <div class="over-meta-row">
              <span class="over-stat-label">Peak tier</span>
              <span class="over-meta-value" id="finalTier">Spark</span>
            </div>
            <div class="over-meta-row">
              <span class="over-stat-label">Peak combo</span>
              <span class="over-meta-value" id="finalCombo">×0</span>
            </div>
          </div>
        </div>

        <p class="over-best" id="newBest" hidden>New best</p>

        <div class="over-actions">
          <button type="button" class="cta" id="retryBtn">Retry</button>
          <button type="button" class="cta cta--ghost" id="copySummaryBtn">Copy summary</button>
          <button type="button" class="cta cta--ghost" id="shareBtn" hidden>Share</button>
        </div>
        <p class="over-copy-feedback" id="copyFeedback" hidden aria-live="polite">Copied</p>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
